<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивный тренажёр · Аничков лицей · 8 класс</title>
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
</head>
<body data-page="trainer">

  <div class="container">
    <!-- Верхняя панель навигации -->
    <header class="site-header">
      <div class="top-bar">
        <a href="index.html">← Ко всем урокам</a>
        <div style="display:flex; gap:10px; align-items:center;">
          <a href="stats.html" class="stats-link" title="Статистика">📊 <span class="stats-link-text">Статистика</span></a>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:16px;">
        <div>
          <h1 class="main-title" id="trainerTitle">Урок 1 · Классная работа</h1>
          <p class="subtitle" id="trainerTopic"></p>
        </div>

        <!-- Выбор варианта и ввод имени -->
        <div style="display:flex; flex-direction:column; gap:8px; min-width:260px;">
          <label for="studentNameInput" style="font-size:13.5px; color:#6d593c; font-weight:bold;">Ученик (Фамилия Имя):</label>
          <input type="text" id="studentNameInput" class="student-name-input" placeholder="Например: Смирнов Артём" style="font-size:15px; padding:6px 12px;">

          <label for="variantSelect" style="font-size:13.5px; color:#6d593c; font-weight:bold; margin-top:4px;">Выбрать работу:</label>
          <select id="variantSelect" class="student-name-input" style="font-size:14.5px; padding:6px 8px; cursor:pointer;"></select>
        </div>
      </div>
    </header>

    <!-- Колода интерактивных слайдов тетради -->
    <main id="slidesDeck"></main>
  </div>

  <!-- Фиксированная нижняя панель навигации -->
  <footer class="sticky-footer">
    <div class="footer-content">
      <div class="nav-group">
        <button class="btn-nav" id="btnPrev">◀ Назад</button>
        <span class="slide-counter" id="slideCounter">1 / 1</span>
        <button class="btn-nav" id="btnNext">Далее ▶</button>
      </div>
      <div class="nav-group">
        <button class="btn-nav btn-check" id="btnCheck">Проверить ответ ✏️</button>
      </div>
    </div>
  </footer>

  <!-- Модальное окно: Памятка / Теория -->
  <div class="modal-overlay" id="theoryModal" onclick="if(event.target === this) closeTheoryModal()">
    <div class="modal-box">
      <button class="modal-close" onclick="closeTheoryModal()">×</button>
      <div id="theoryContent"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/checker.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
